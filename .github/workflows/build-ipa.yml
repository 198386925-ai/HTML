# STAGED COPY ONLY — DO NOT PUSH THIS FILE VIA THE GITHUB API.
# The stored GitHub token is repo-scope only (no workflow scope), so an
# API push of .github/workflows/* returns 404. Add this file in the
# GitHub web UI instead (repository -> Add file -> Create new file, or
# edit the existing build-ipa.yml there), pasting the content below
# the comment lines. It is the existing LUIYoAdmin workflow with only
# the app/project/IPA names changed to HTML; everything else is kept.
name: Build HTML IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: html-ipa-main
  cancel-in-progress: true

jobs:
  build:
    if: github.event.repository.private == false
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          test -d /Applications/Xcode_26.3.app/Contents/Developer
          echo 'DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer' >> "$GITHUB_ENV"
      - name: Verify checked-out source
        shell: bash
        run: |
          set -euo pipefail
          echo "Building repository source at $GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f HTML.xcodeproj/project.pbxproj
          test -f HTML.xcodeproj/xcshareddata/xcschemes/HTML.xcscheme
          test -f scripts/build-ipa.sh
          git status --short
      - name: Build unsigned IPA from repository source
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-ipa.sh
          ls -lh output/
          shasum -a 256 output/*.ipa output/*-src.zip
      - name: Save IPA and source backup
        uses: actions/upload-artifact@v4
        with:
          name: HTML-IPA-and-source
          path: output/
